# The public face of the deployment: serves the Flutter web build and proxies
# /api to the backend.
#
# One origin for both, deliberately. If the app were served from a different
# origin to the API, every request would be cross-origin: CORS to configure, a
# preflight on each write, and cookies that need SameSite exceptions. Same origin
# removes the whole category.

server {
    listen 80;
    server_name _;

    # Nothing here advertises the version; it is free information for anyone
    # choosing which exploit to try.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The Flutter build is mostly compressed-friendly text: the main.dart.js of a
    # release build is megabytes before compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml font/ttf font/woff font/woff2;

    # An upload cap, so a request body cannot be used to exhaust memory. Larger
    # than any form this app submits and smaller than anything alarming; raise it
    # if product image upload is added.
    client_max_body_size 2m;

    # ---- the API ----------------------------------------------------------
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends this hop. The backend is configured with TRUST_PROXY_HOPS=1 and
        # walks exactly one entry back from the end, so a client that sends its
        # own X-Forwarded-For cannot choose the address the login lockout and the
        # audit trail record.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A backup download is a whole database as one response, and a report over
        # a year of orders is not instant. The default 60s would cut both off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Streamed straight through rather than buffered to disk first, so a large
        # download starts arriving immediately.
        proxy_buffering off;
    }

    # ---- the app ----------------------------------------------------------
    # Everything revalidates, and `immutable` is used nowhere.
    #
    # `immutable` is only ever correct for a file whose NAME changes with its
    # contents, and Flutter's web output is not built that way: main.dart.js,
    # flutter.js and flutter_bootstrap.js keep the same names across every build.
    # Caching those for a year means a deploy never reaches anyone who has
    # already used the app — they keep running the previous bundle until
    # something makes them hard-refresh, which for most people is never.
    #
    # Revalidation is cheap: the browser sends a conditional request and nginx
    # answers 304 with no body whenever the file is unchanged. Fonts and images
    # get a short expiry because they genuinely do not change between deploys.
    location ~* \.(?:woff2?|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|wasm|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # index.html is NEVER cached. It is the file that names the hashed assets, so
    # a cached copy keeps pointing at the previous deploy's bundle — the reason a
    # release appears to do nothing until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: /orders/21 is a route inside the app, not a file. Any
    # unmatched path falls back to index.html so a deep link or a refresh works
    # instead of returning 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. A Content-Security-Policy is deliberately NOT set here:
    # Flutter's web bundle needs 'wasm-unsafe-eval', and a policy written blind
    # would either break the app or be loose enough to be theatre. It belongs with
    # the TLS terminator in front of this, written against the real origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
